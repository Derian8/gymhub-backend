<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PULSO: el ritmo de tu gimnasio en un solo lugar. Entrenamiento, comunidad y progreso." />
    <link rel="icon" type="image/png" href="/marca/pulso-icono.png" />
    <meta name="theme-color" content="#d90018" />
    <title>PULSO — El ritmo de tu gimnasio</title>
    <script>
      const themeStorageKey = 'gymhub-theme';
      try {
        const savedTheme = localStorage.getItem(themeStorageKey);
        const savedState = JSON.parse(localStorage.getItem('gymhub-auth') || '{}');
        const legacyTheme = savedState?.state?.theme;
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : legacyTheme === 'light' || legacyTheme === 'dark'
            ? legacyTheme
            : 'dark';
        localStorage.setItem(themeStorageKey, theme);
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
