<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/gymhub-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GymHub — Gestión de Gimnasio</title>
    <meta name="description" content="Sistema de gestión integral para gimnasios. Miembros, entrenadores y administradores." />
    <script>
      try {
        const savedState = JSON.parse(localStorage.getItem('gymhub-auth') || '{}');
        const theme = savedState?.state?.theme === 'light' ? 'light' : 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
