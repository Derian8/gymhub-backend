services:
  redis:
    image: redis:7-alpine
    container_name: gym-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./gymhub
    container_name: gym-backend
    working_dir: /app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn gymhub.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    env_file:
      - .env
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 5

  celery:
    build:
      context: ./gymhub
    container_name: gym-celery
    working_dir: /app
    command: celery -A gymhub worker -l info -Q default,celery
    env_file:
      - .env
    volumes:
      - media_data:/app/media
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A gymhub inspect ping -d celery@$$(hostname) >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  celerybeat:
    build:
      context: ./gymhub
    container_name: gym-celerybeat
    working_dir: /app
    command: celery -A gymhub beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-15000}
    container_name: gym-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

volumes:
  redis_data:
  media_data:
  static_data:
