services:
  - type: web
    name: gymhub-api-feria
    runtime: docker
    region: oregon
    plan: free
    dockerContext: ./gymhub
    dockerfilePath: ./gymhub/Dockerfile
    autoDeployTrigger: 'off'
    healthCheckPath: /health/ready/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DB_CONN_MAX_AGE
        value: 60
      - key: DB_DISABLE_SERVER_SIDE_CURSORS
        value: 'True'
      - key: REDIS_URL
        value: locmem://
      - key: CELERY_BROKER_URL
        value: memory://
      - key: CELERY_RESULT_BACKEND
        value: cache+memory://
      - key: DEBUG
        value: 'False'
      - key: AI_PROVIDER
        value: deterministic
      - key: USE_S3_STORAGE
        value: 'False'
      - key: ALLOWED_HOSTS
        value: .onrender.com,api.pulsocr.me
      - key: CORS_ALLOWED_ORIGINS
        value: https://pulsocr.me,https://www.pulsocr.me,https://proyectoappgym-frontend.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://pulsocr.me,https://www.pulsocr.me,https://proyectoappgym-frontend.vercel.app
      - key: AUTH_COOKIE_SECURE
        value: 'True'
      - key: AUTH_COOKIE_SAMESITE
        value: Lax
      - key: SESSION_COOKIE_SECURE
        value: 'True'
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: CSRF_COOKIE_SECURE
        value: 'True'
      - key: CSRF_COOKIE_SAMESITE
        value: Lax
      - key: USE_X_FORWARDED_HOST
        value: 'True'
      - key: USE_X_FORWARDED_PROTO
        value: 'True'
      - key: SECURE_SSL_REDIRECT
        value: 'True'
      - key: CRON_SECRET
        generateValue: true
